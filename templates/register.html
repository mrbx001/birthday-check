{% extends "base.html" %}

{% block title %}রেজিস্টার - Birthday Check{% endblock %}

{% block content %}
<h1>🎂 নতুন অ্যাকাউন্ট তৈরি করুন</h1>

{% if error %}
    <div class="error">{{ error }}</div>
{% endif %}

<form method="POST">
    <div class="form-group">
        <label for="full_name">সম্পূর্ণ নাম:</label>
        <input type="text" id="full_name" name="full_name" required>
    </div>

    <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
    </div>

    <div class="form-group">
        <label for="email">ইমেইল:</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
        <label for="birthday">জন্মদিন:</label>
        <input type="date" id="birthday" name="birthday" required>
    </div>

    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
    </div>

    <button type="submit">অ্যাকাউন্ট তৈরি করুন</button>
</form>

<div class="link">
    ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="{{ url_for('login') }}">লগইন করুন</a>
</div>
{% endblock %}
